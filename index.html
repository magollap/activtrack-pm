<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>ActivTrack</title>
    <meta name="description" content="ActivTrack - project and task management with AI skills. Works offline." />
    <meta name="theme-color" content="#ffffff" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
      try {
        var t = JSON.parse(localStorage.getItem('workday:prefs:theme'));
        var dark = t === 'dark' || (t !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.classList.add('dark');
        document.querySelector('meta[name="theme-color"]').setAttribute('content', dark ? '#070707' : '#ffffff');
      } catch (e) {}
    </script>
    <meta property="og:title" content="ActivTrack" />
    <meta property="og:description" content="Project and task management with AI skills." />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
