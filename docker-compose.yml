services:
  workday:
    build: .
    image: workday:latest
    container_name: workday
    ports:
      - "8080:8080"
    environment:
      # Set to "1" when ActivTrack is served over HTTPS so sign-in cookies are only sent securely.
      COOKIE_SECURE: "0"
      # AI assistant (optional): set one key in a .env file next to this file, e.g. GEMINI_API_KEY=...
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
    volumes:
      - workday-data:/app/data
    restart: unless-stopped

volumes:
  workday-data:
